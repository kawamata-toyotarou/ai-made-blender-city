<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURORA / Street Life</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#19232b;color:#f1ede3;font:14px system-ui,"Yu Gothic",sans-serif}canvas{display:block}#brand{position:fixed;left:30px;top:26px;pointer-events:none;text-shadow:0 2px 12px #0009}#brand strong{font-size:20px;letter-spacing:.22em}#brand small{display:block;margin-top:6px;color:#d3d9db;letter-spacing:.13em;font-size:10px}#hud{position:fixed;bottom:22px;left:30px;right:30px;display:flex;align-items:center;justify-content:space-between;font-size:12px;text-shadow:0 2px 5px #000}#actions{z-index:30;position:fixed;right:24px;top:24px;display:flex;gap:8px}button{border:1px solid #c2d5dd55;background:#10202ccc;color:#eef3f0;border-radius:5px;padding:10px 15px;font:inherit;cursor:pointer}button:hover{background:#244454}button:disabled{opacity:.4;cursor:wait}#pause{position:fixed;inset:0;background:linear-gradient(90deg,#08151dd9,#08151d55);display:flex;align-items:center;padding:7vw;backdrop-filter:blur(3px)}#panel{width:min(510px,90vw)}.eyebrow{letter-spacing:.3em;color:#9abcc8;font-size:11px}h1{font-size:clamp(32px,4vw,58px);font-weight:400;line-height:1.35;letter-spacing:.02em;margin:22px 0}p{line-height:1.9;color:#c2ced0;font-size:14px}#start,#resume{background:#d4e7e5;color:#17353c;border:none;padding:15px 25px;margin-top:20px;font-weight:600;min-width:190px}.keys{display:grid;grid-template-columns:100px 1fr;gap:12px;margin-top:24px;font-size:12px;color:#bacacf}.keys b{font-weight:500;color:#f0f3ee}.hidden{display:none!important}#reticle{position:fixed;top:50%;left:50%;width:4px;height:4px;border-radius:50%;background:#fff7;pointer-events:none}a{color:inherit}</style></head><body>
<div id="brand"><strong>AURORA</strong><small>STREET LIFE / HUMAN SCALE</small></div><div id="actions"><button id="light">夜の街</button><button id="reset">出発地点へ R</button></div><div id="reticle"></div>
<div id="hud"><span>WASD 移動　·　マウス 見回す　·　Shift 早歩き　·　Esc 休憩</span><span id="position"></span></div>
<div id="pause"><div id="panel"><div class="eyebrow">EXPLORE ON FOOT</div><h1>未来の街を、<br>あなたの足で。</h1><p>店先の灯り、通りを歩く人々、高架を渡る交通網。<br>身長約1.7mの目線から、街の細部を探索してください。</p><div class="keys"><b>W A S D / 矢印</b><span>前後左右に歩く</span><b>マウス</b><span>周囲を見回す</span><b>Shift / Esc</b><span>早歩き / カーソルを戻して休憩</span></div><p id="loading">街と人物を準備しています…</p><button id="start" disabled>街を歩き始める →</button><button id="resume" class="hidden">散策を再開 →</button><p style="font-size:11px;margin-top:20px">マウスが固定されない場合は、画面をドラッグして見回せます。</p></div></div>
<script src="data.js"></script><script src="app.js"></script></body></html>
